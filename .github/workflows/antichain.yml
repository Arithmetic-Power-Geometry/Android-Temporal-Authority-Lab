name: Authority antichain equivalence
on:
  push:
    branches: [main, antichain-authority-v4]
  pull_request:
jobs:
  antichain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m lab.antichain_exhaustive
      - run: python -m lab.breakthrough_gate
