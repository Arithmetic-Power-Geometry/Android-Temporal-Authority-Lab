name: Authority trap duality
on:
  push:
    branches: [main, authority-cut-duality-v5]
  pull_request:
jobs:
  duality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m lab.trap_exhaustive
      - run: python -m lab.breakthrough_gate
