name: Documented semantics oracle
on:
  push:
    branches: [main, documented-semantics-oracle-v6]
  pull_request:
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m lab.experiment_matrix
      - run: python -m lab.breakthrough_gate
