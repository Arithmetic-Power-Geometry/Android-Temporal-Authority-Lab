name: Android emulator evidence
on:
  push:
    branches: [main, android-emulator-evidence-v7]
  pull_request:

jobs:
  documented-baseline:
    name: Pixel profile API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run owned-emulator baseline
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d -s SAFESEP_EVIDENCE:I '*:S' > ../evidence-api-${{ matrix.api }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence-api-${{ matrix.api }}
          path: evidence-api-${{ matrix.api }}.txt
          if-no-files-found: warn
