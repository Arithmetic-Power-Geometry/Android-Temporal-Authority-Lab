name: Android emulator evidence
on:
  push:
    branches: [main, android-emulator-evidence-v7, uri-authority-lifecycle-v8]
  pull_request:

jobs:
  documented-baseline:
    name: Pixel profile API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run owned-emulator evidence suite
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace
            BASE_STATUS=$?
            gradle :app:assembleDebug
            BUILD_STATUS=$?
            if [ $BUILD_STATUS -eq 0 ]; then
              adb install -r app/build/outputs/apk/debug/app-debug.apk
              INSTALL_STATUS=$?
            else
              INSTALL_STATUS=1
            fi
            if [ $BASE_STATUS -eq 0 ] && [ $INSTALL_STATUS -eq 0 ]; then
              gradle :consumer:connectedDebugAndroidTest --stacktrace
              URI_STATUS=$?
            else
              URI_STATUS=1
            fi
            adb logcat -d -s SAFESEP_EVIDENCE:I '*:S' > ../evidence-api-${{ matrix.api }}.txt || true
            if [ $BASE_STATUS -ne 0 ] || [ $BUILD_STATUS -ne 0 ] || [ $INSTALL_STATUS -ne 0 ] || [ $URI_STATUS -ne 0 ]; then
              exit 1
            fi
            exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence-api-${{ matrix.api }}
          path: evidence-api-${{ matrix.api }}.txt
          if-no-files-found: warn
