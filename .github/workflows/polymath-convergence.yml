name: Polymath convergence search
on:
  push:
    branches: [main, convergence-lab-v1]
  pull_request:
jobs:
  falsify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q
      - run: python -m lab.exhaustive_search
