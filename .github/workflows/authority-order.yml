name: Authority information order
on:
  push:
    branches: [main, authority-information-order-v2]
  pull_request:
jobs:
  theorem-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m lab.authority_information_order
